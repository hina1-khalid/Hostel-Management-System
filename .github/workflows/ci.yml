name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGO_URI: mongodb://localhost:27017/hostel_ci
      JWT_SECRET: ci_only_secret_not_used_anywhere_else
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend build + UI tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGO_URI: mongodb://localhost:27017/hostel_ci
      JWT_SECRET: ci_only_secret_not_used_anywhere_else
      LOGIN_RATE_LIMIT: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Start the API with demo data
        working-directory: backend
        run: |
          npm ci
          node seed.js --force
          nohup node server.js > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/health && break; sleep 1; done
      - name: Build the app
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: UI tests
        working-directory: frontend
        run: npm test
      - name: Show API log if something failed
        if: failure()
        run: cat server.log

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          JWT_SECRET: ci_only_secret_not_used_anywhere_else
